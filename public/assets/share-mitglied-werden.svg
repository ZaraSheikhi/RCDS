<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Gründe, Mitglied des RCDS zu werden</title>
  <desc id="desc">Quadratische RCDS Bremen Share-Kachel mit fünf Argumenten für eine Mitgliedschaft.</desc>
  <rect width="1080" height="1080" fill="#f0f0f0"/>
  <rect x="64" y="64" width="952" height="952" fill="#ffffff" stroke="#1d4265" stroke-width="10"/>
  <rect x="64" y="64" width="260" height="156" fill="#1d4265"/>
  <path d="M64 220 C150 202 216 160 260 64 L324 64 C278 188 190 278 64 314 Z" fill="#1d4265"/>
  <text x="152" y="132" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">RCDS</text>
  <text x="152" y="184" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">Bremen</text>
  <rect x="174" y="278" width="520" height="64" fill="#1d4265"/>
  <rect x="174" y="336" width="632" height="64" fill="#1d4265"/>
  <text x="204" y="324" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">Gründe, Mitglied</text>
  <text x="204" y="382" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">des RCDS zu werden:</text>
  <circle cx="218" cy="460" r="9" fill="#1d4265"/>
  <text x="248" y="470" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">Studentische Interessen vertreten:</text>
  <text x="248" y="504" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="760">Mitgestaltung an Hochschule und Landespolitik.</text>
  <circle cx="218" cy="568" r="9" fill="#1d4265"/>
  <text x="248" y="578" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">Netzwerk aufbauen:</text>
  <text x="248" y="612" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="760">Zugang zu einem internationalen Netzwerk.</text>
  <circle cx="218" cy="676" r="9" fill="#1d4265"/>
  <text x="248" y="686" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">Skills entwickeln:</text>
  <text x="248" y="720" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="760">Organisation, Kommunikation und Leadership.</text>
  <circle cx="218" cy="784" r="9" fill="#1d4265"/>
  <text x="248" y="794" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">Politische Bildung:</text>
  <text x="248" y="828" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="760">Veranstaltungen, Seminare und Debatten.</text>
  <circle cx="218" cy="892" r="9" fill="#1d4265"/>
  <text x="248" y="902" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">Demokratische Werte fördern:</text>
  <text x="248" y="936" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="760">Realitätsnah und ideologiefrei eintreten.</text>
  <rect x="64" y="972" width="952" height="44" fill="#1d4265"/>
  <text x="104" y="1003" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">Mitglied werden. Campus gestalten.</text>
</svg>
